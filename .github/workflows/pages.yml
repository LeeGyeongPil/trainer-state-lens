# Publishes the static app to GitHub Pages.
# Off by default: a repository without Pages (or a private one) would fail at configure-pages on every push.
# To turn it on: Settings > Pages > Source: GitHub Actions, then add the repository variable
# PAGES_ENABLED=true (Settings > Secrets and variables > Actions > Variables). Manual runs always work.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # Skipped (not failed) until Pages is switched on for this repository.
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
